site_name: 1708 · Sostenibilidad aplicada al sistema productivo
site_description: Curso práctico en Java para el ciclo de Desarrollo de Aplicaciones Web
# Cambia esta URL por la de tu repositorio en GitHub Pages
site_url: https://USUARIO.github.io/sostenibilidad-1708/
docs_dir: docs

theme:
  name: material
  language: es
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

nav:
  - Inicio: index.md
  - Entorno de trabajo: entorno.md
  - Unidades:
      - 1 · Sostenibilidad, ODS y ASG: ut1/index.md
      - 2 · Retos ambientales y energía: ut2/index.md
      - 3 · Tu trabajo y tu vida: ut3/index.md
      - 4 · Economía circular: ut4/index.md
      - 5 · Huella del software: ut5/index.md
      - 6 · Plan de sostenibilidad: ut6/index.md
  - Cómo se evalúa: evaluacion.md

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
