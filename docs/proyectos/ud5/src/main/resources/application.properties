spring.application.name=huella-software
server.port=8080

spring.datasource.url=jdbc:h2:mem:huella
spring.jpa.hibernate.ddl-auto=create-drop

# --- Medición -------------------------------------------------------------
# Estadísticas de Hibernate: al final de cada petición se registra cuántas consultas lanzó
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO
# Actuator: métricas en /actuator/metrics/http.server.requests
management.endpoints.web.exposure.include=health,metrics

# --- Parámetros del laboratorio ------------------------------------------
# Intensidad de la red (g CO2/kWh) usada para estimar la huella; ponle la que calculaste en la UD2
huella.intensidad-g-kwh=150
# Umbral por encima del cual la tarea carbon-aware se aplaza
huella.umbral-g-kwh=120
